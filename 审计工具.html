<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计工具 · Audit Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
  :root{
    --green:#0b7a3e; --green-dark:#085c2f; --green-bg:#e9f5ee; --green-line:#cde7d8;
    --ink:#1f2a24; --muted:#6b7a71; --line:#e3eae6; --neg:#c0392b;
    --paper:#ffffff; --bg:#f4f7f5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  }
  .layout{display:flex; align-items:flex-start; gap:20px; max-width:1680px; margin:0 auto; padding:20px 24px 60px;}
  .wrap{flex:1; min-width:0;}

  /* ===== 侧边栏 ===== */
  .sidebar{
    width:190px; flex:none; background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:10px 8px; position:sticky; top:20px;
    box-shadow:0 1px 3px rgba(20,40,30,.05);
  }
  .sidebar .side-title{font-size:11px; color:var(--muted); padding:6px 10px 8px; letter-spacing:1px; font-weight:600;}
  .side-item{
    display:flex; align-items:center; gap:9px; width:100%; padding:10px 12px; border:none; background:transparent;
    border-radius:8px; font-size:13.5px; color:var(--ink); cursor:pointer; text-align:left; font-family:inherit;
    transition:background .15s;
  }
  .side-item:hover{background:var(--green-bg);}
  .side-item.active{background:var(--green); color:#fff; font-weight:600;}
  .side-item .ico{width:20px; text-align:center; flex:none;}
  .side-item.group .arrow{width:14px; flex:none; font-size:10px; color:var(--muted); transition:transform .15s; display:inline-block;}
  .side-item.group.collapsed .arrow{transform:rotate(-90deg);}
  .side-item.group.active{background:var(--green-bg); color:var(--ink); font-weight:600;}
  .side-item.sub{padding-left:38px; font-size:13px;}
  .side-item.sub2{padding-left:58px; font-size:12.5px;}
  .side-item.disabled{opacity:.4; cursor:not-allowed;}
  .side-item.disabled:hover{background:transparent;}
  .side-children.hidden{display:none;}

  /* ===== 底稿页 ===== */
  .wp-page{display:none; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    box-shadow:0 1px 4px rgba(20,40,30,.06); margin-top:14px;}
  .wp-page.active{display:block;}
  .wp-head{padding:20px 28px 14px; border-bottom:2px solid var(--green-line); position:relative;}
  .wp-head h2{font-size:20px; font-weight:700;}
  .wp-head .ref{font-size:12px; color:var(--muted); margin-top:3px;}


  /* ===== RMA费用底稿 ===== */
  .rma-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 28px; background:#fbfdfb; border-bottom:1px solid var(--line);}
  .rma-toolbar .sep{width:1px; height:22px; background:var(--line); flex:none;}
  .rma-search{padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:inherit; width:230px;}
  .rma-meta{font-size:12.5px; color:var(--muted); padding:12px 28px 0;}
  .rma-meta b{color:var(--ink); font-weight:600;}
  .rma-sec{padding:14px 28px 4px; font-size:14.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .rma-sec .cnt-badge{font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:1px 9px; font-weight:400;}
  .share-bar{display:flex; align-items:center; gap:8px;}
  .share-bar .bar{flex:1; height:8px; border-radius:4px; background:#eef3ef; overflow:hidden; min-width:60px;}
  .share-bar .bar i{display:block; height:100%; border-radius:4px; background:var(--green);}
  .share-bar .pct{font-size:12px; color:var(--muted); width:52px; text-align:right; flex:none; font-variant-numeric:tabular-nums;}
  .rma-two{display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:14px 28px;}
  @media (max-width:1100px){ .rma-two{grid-template-columns:1fr;} }
  tr.tr-dept{cursor:pointer;}
  tr.tr-dept:hover td{background:var(--green-bg);}
  tr.dept-kids.hidden{display:none;}
  tr.dept-kids td{background:#f7faf7; font-size:12.5px;}
  tr.month-sum td{background:#eef6f0; font-weight:600; color:var(--green-dark); font-size:12.5px;}
  .rma-empty{padding:40px 28px; text-align:center; color:var(--muted); font-size:13.5px;}

  /* ===== 控制程序表 ===== */
  .ctrl-block{padding:6px 14px 8px;}
  .ctrl-toolbar{display:flex; gap:10px; align-items:center; padding:12px 28px 16px; background:#fbfdfb; border-top:1px solid var(--line);}
  .ctrl-card{border:1px solid #d6e4f5; border-left:4px solid #2c7be5; border-radius:12px; padding:14px 14px 16px; margin-bottom:14px; background:linear-gradient(to right,#fbfdff 0%,#fff 12%); box-shadow:0 2px 6px rgba(44,123,229,.06); overflow-x:auto;}
  .ctrl-card.locked{border-color:#e0d6ae; border-left-color:#c9b357; background:#fdfcf6; box-shadow:0 2px 6px rgba(201,179,87,.10);}
  .ctrl-card.locked .ctrl-no{color:#a5832e;}
  .ctrl-card.locked .ctrl-table th{background:#faf6e8; color:#7a5f1a; border-bottom-color:#c9b357;}
  .ctrl-card.locked .ctrl-table td input, .ctrl-card.locked .ctrl-table td select, .ctrl-card.locked .ctrl-table td textarea{background:#f5f4ee; color:#6b6753; cursor:not-allowed;}
  .ctrl-card.locked .ctrl-name{color:#7a5f1a; cursor:not-allowed;}
  .ctrl-card.locked .ctrl-del, .ctrl-card.locked .ctrl-row-add, .ctrl-card.locked td.num button{opacity:.45; pointer-events:none;}
  .ctrl-card-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #e3ecf5;}
  .ctrl-card.locked .ctrl-card-head{border-bottom-color:#e8e2c8;}
  .ctrl-card-head span.ctrl-no{font-size:14.5px; font-weight:800; color:#2c7be5; flex:none; letter-spacing:.3px;}
  .ctrl-card-head input.ctrl-name{flex:1; border:none; border-bottom:1.5px dashed #c8d8ea; padding:3px 6px; font-size:14px; font-weight:600; font-family:inherit; outline:none; background:transparent; min-width:0; color:#1a3d6e;}
  .ctrl-card-head input.ctrl-name:focus{border-bottom-color:#2c7be5; border-style:solid;}
  .ctrl-card-head button.ctrl-del{border:1px solid #f0c9c3; background:#fff; color:#c0392b; cursor:pointer; font-size:12.5px; padding:4px 11px; border-radius:6px; font-family:inherit; white-space:nowrap;}
  .ctrl-card-head button.ctrl-del:hover{background:#fdecea;}
  .ctrl-card-head button.ctrl-lock{border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer; font-size:12.5px; padding:4px 11px; border-radius:6px; font-family:inherit; white-space:nowrap;}
  .ctrl-card-head button.ctrl-lock:hover{border-color:var(--green); color:var(--green-dark); background:var(--green-bg);}
  .ctrl-card-head button.ctrl-lock.on{background:#fdf8ec; border-color:#e2b13c; color:#a5731a; font-weight:600;}
  .ctrl-card-head button.ctrl-lock.on:hover{background:#fbf1d9; border-color:#d3a022; color:#8d6212;}
  table.ctrl-table{width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; font-size:14px; background:#fff; border-radius:8px; table-layout:auto;}
  table.ctrl-table th{background:linear-gradient(180deg,#eef5fb,#e2edf7); text-align:left; padding:9px 12px; border-bottom:2px solid #2c7be5; color:#1a3d6e; font-size:13px; font-weight:700; letter-spacing:.5px;}
  table.ctrl-table td{padding:8px 12px; border-bottom:1px solid #eef2f7; border-right:1px solid #eef2f7; vertical-align:top; min-width:280px;}
  table.ctrl-table tr td:last-child{border-right:none;}
  /* 转置表：左侧字段名列 */
  table.ctrl-table-v th.ctrl-rowh{width:110px; background:linear-gradient(180deg,#eef5fb,#e2edf7); border-right:2px solid #2c7be5; border-bottom:1px solid #e2edf7; color:#1a3d6e; font-size:13.5px; font-weight:700; letter-spacing:.5px; vertical-align:middle; text-align:left; padding:10px 12px;}
  table.ctrl-table-v th.ctrl-rowh-op{width:110px; background:#f8fbfe; border-right:2px solid #2c7be5; border-bottom:none;}
  table.ctrl-table-v tr:last-child td{border-bottom:none;}
  table.ctrl-table-v tr:last-child th{border-bottom:none;}
  /* 成文制度表头行（跨所有列合并） */
  table.ctrl-table-v tr.ctrl-policy-row td.ctrl-policy-cell{min-width:0; background:#fbfdff;}
  table.ctrl-table-v tr.ctrl-policy-row td.ctrl-policy-cell textarea{min-height:64px;}
  table.ctrl-table td textarea{width:100%; box-sizing:border-box; border:1.5px dashed transparent; border-radius:6px; padding:10px 12px; font-size:15px; font-family:inherit; line-height:1.75; background:transparent; outline:none; color:var(--ink); resize:vertical; min-height:96px; white-space:pre-wrap; word-break:break-word;}
  table.ctrl-table tbody tr:hover td{background:#f8fbfe;}
  table.ctrl-table tbody tr:last-child td{border-bottom:none;}
  table.ctrl-table td input, table.ctrl-table td select{width:100%; border:1.5px dashed transparent; border-radius:6px; padding:7px 10px; font-size:15px; font-family:inherit; background:transparent; outline:none; color:var(--ink);}
  table.ctrl-table td select{cursor:pointer; font-weight:600; color:#1a3d6e;}
  table.ctrl-table td select:disabled{cursor:not-allowed; color:#6b6753;}
  table.ctrl-table td input:hover, table.ctrl-table td select:hover, table.ctrl-table td textarea:hover{border-color:#c8d8ea;}
  table.ctrl-table td input:focus, table.ctrl-table td select:focus, table.ctrl-table td textarea:focus{border-color:#2c7be5; border-style:solid; background:#fff; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  table.ctrl-table td.num{text-align:center; width:44px;}
  table.ctrl-table td.num button{background:none; border:none; color:#c0392b; cursor:pointer; font-size:15px; padding:0 5px; border-radius:4px;}
  table.ctrl-table td.num button:hover{color:#8e1a1a; background:#fdecea;}
  .ctrl-row-add{padding:8px 0 2px;}
  .ctrl-empty{padding:10px 28px; text-align:center; color:var(--muted); font-size:13px;}

  /* ===== 审计结论 ===== */
  .conclusion-block{margin:22px 28px 0; padding:0 0 16px;}
  .conclusion-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .conclusion-head h3{margin:0; font-size:16px; color:#1a3d6e;}
  .conclusion-head .spacer{flex:1;}
  .conclusion-mod{margin-bottom:16px;}
  .conclusion-mod h4{margin:0 0 7px; font-size:13.5px; color:#1a3d6e; font-weight:600;}
  .conclusion-mod h4 .mod-no{display:inline-block; min-width:20px; height:20px; line-height:20px; text-align:center;
    background:#eef5fb; color:#1a3d6e; border-radius:5px; font-size:12px; margin-right:7px;}
  .conclusion-mod textarea{width:100%; box-sizing:border-box; min-height:76px; resize:vertical; font-family:inherit;
    font-size:13.5px; line-height:1.7; padding:9px 12px; border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--ink); outline:none;}
  .conclusion-mod textarea:focus{border-color:#2c7be5; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  .concl-sub{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:8px; background:#fbfdfb;}
  .concl-sub-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .concl-sub-head span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .concl-sub-head .spacer{flex:1;}
  .concl-sub-head button{font-size:12px; padding:3px 10px;}
  .concl-item{display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;}
  .concl-item textarea{min-height:44px; flex:1;}
  .concl-item button{flex:none; border:1px solid var(--line); background:#fff; color:#c0392b; cursor:pointer;
    border-radius:6px; padding:4px 9px; font-size:13px;}
  .concl-item button:hover{background:#fdecea; border-color:#f5c6c0;}
  .concl-sign{display:flex; align-items:center; gap:12px; margin-top:18px; padding:14px 16px;
    border:1px dashed #c9d8d0; border-radius:8px; background:#fbfdfb;}
  .concl-sign label{font-size:13.5px; color:#1a3d6e; font-weight:600; white-space:nowrap;}
  .concl-sign input{flex:1; max-width:320px; font-family:inherit; font-size:13.5px; padding:7px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fff; outline:none;}
  .concl-sign input:focus{border-color:#2c7be5; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  .concl-note{margin-top:9px; font-size:12px; color:var(--muted);}

  /* ===== 底稿二级页签 ===== */
  .wp-tabs{display:flex; gap:8px; padding:12px 28px 0; background:#fbfdfb; border-bottom:1px solid var(--line);}
  .wp-tab{border:1px solid transparent; border-bottom:none; background:transparent; color:var(--muted); cursor:pointer;
    padding:9px 18px; font-size:14px; font-family:inherit; font-weight:600; border-radius:8px 8px 0 0; position:relative; top:1px;}
  .wp-tab:hover{color:var(--green-dark);}
  .wp-tab.active{background:#fff; color:#1a3d6e; border-color:var(--line); box-shadow:inset 0 3px 0 #2c7be5;}

  /* ===== 比率分析：同比 ===== */
  .ratio-block{padding:18px 28px 26px;}
  .ratio-bar{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:14px;}
  .ratio-field{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .ratio-field select{font-family:inherit; font-size:13.5px; padding:6px 10px; border:1px solid var(--line);
    border-radius:7px; background:#fff; color:var(--ink); outline:none;}
  .ratio-field select:focus{border-color:#2c7be5; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  .ratio-scroll{overflow:auto; max-height:62vh; border:1px solid var(--line); border-radius:8px; background:#fff;}
  table.ratio-table{width:100%; min-width:900px; border-collapse:collapse; border:none; border-radius:0; font-size:13.5px;}
  table.ratio-table thead th{position:sticky; top:0; z-index:2; background:#f7faf8; color:var(--muted);
    font-weight:600; text-align:left; border-bottom:1px solid var(--line); padding:9px 12px; white-space:nowrap;}
  table.ratio-table thead th.num{text-align:right;}
  table.ratio-table td{border-bottom:1px solid #edf1ee; border-right:none; padding:9px 12px; vertical-align:middle;}
  table.ratio-table tbody tr:hover td{background:#fafcfb;}
  table.ratio-table td.code{font-family:Consolas,"SF Mono",monospace; color:var(--muted); white-space:nowrap;}
  table.ratio-table td.num{text-align:right; white-space:nowrap;}
  .ratio-en{color:var(--ink);}
  .ratio-cn{font-size:12px; color:var(--muted); margin-top:2px;}
  table.ratio-table td.num.up{color:#1d7a3c;}
  table.ratio-table td.num.down{color:var(--neg);}
  .ratio-note{margin-top:10px; font-size:12px; color:var(--muted); line-height:1.7;}
  .ratio-section h3{margin:0 0 10px; font-size:14px; color:#1a3d6e; font-weight:600;}
  .ratio-section{margin-top:18px;}
  table.ratio-table tr.ratio-total td{background:#f7faf8; font-weight:700; border-top:2px solid #dfe8e3;}
  .match-card{border:1px solid var(--line); background:#fbfdfb; border-radius:10px; padding:14px 18px; margin-bottom:6px;}
  .match-card.warn{background:#fdf8ec; border-color:#e2b13c;}
  .match-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .match-head h3{margin:0; font-size:14px; color:#1a3d6e; font-weight:600;}
  .match-grid{display:flex; flex-wrap:wrap; gap:32px;}
  .match-cell .lbl{font-size:12px; color:var(--muted); margin-bottom:3px;}
  .match-cell .val{font-size:17px; font-weight:700; color:var(--ink);}
  .match-cell .val.up{color:#1d7a3c;}
  .match-cell .val.down{color:var(--neg);}
  .match-note{margin:10px 0 0; font-size:12px; color:var(--muted); line-height:1.7;}

  /* ===== 抽凭表 ===== */
  .voucher-block{padding:18px 28px 26px;}
  .voucher-title{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .voucher-title h3{font-size:15.5px; font-weight:700; color:var(--ink); flex:none;}
  .voucher-title input{flex:1; max-width:360px; box-sizing:border-box; padding:7px 10px; border:1px solid var(--line);
    border-radius:8px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff; outline:none;}
  .voucher-title input:focus{border-color:#2c7be5; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  .voucher-lock{margin-left:auto; flex:none; border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer;
    font-size:12.5px; font-family:inherit; padding:5px 12px; border-radius:6px; white-space:nowrap;}
  .voucher-lock:hover{border-color:var(--green); color:var(--green-dark); background:var(--green-bg);}
  .voucher-lock.on{background:#fdf8ec; border-color:#e2b13c; color:#a5731a; font-weight:600;}
  .voucher-lock.on:hover{background:#fbf1d9; border-color:#d3a022; color:#8d6212;}
  table.voucher-table textarea:disabled, table.voucher-table input:disabled{background:#f5f4ee; color:#6b6753; cursor:not-allowed;}
  table.voucher-table textarea:disabled:hover, table.voucher-table input:disabled:hover{border-color:transparent;}
  .voucher-table-wrap{overflow:auto; max-height:62vh; border:1px solid var(--line); border-radius:8px; background:#fff;}
  table.voucher-table{width:100%; min-width:1300px; border-collapse:collapse; background:#fff; border:none; border-radius:0; font-size:14px; table-layout:fixed;}
  table.voucher-table thead th{position:sticky; top:0; z-index:2;}
  table.voucher-table th{background:linear-gradient(180deg,#eef5fb,#e2edf7); color:#1a3d6e; font-size:13px; font-weight:700;
    padding:9px 10px; border-bottom:2px solid #2c7be5; text-align:left; white-space:normal; line-height:1.35; word-break:normal; overflow-wrap:anywhere;}
  table.voucher-table td{padding:5px 8px; border-bottom:1px solid #eef2f7; border-right:1px solid #eef2f7; vertical-align:middle;}
  table.voucher-table td:last-child{border-right:none;}
  table.voucher-table tbody tr:hover td{background:#f8fbfe;}
  table.voucher-table input, table.voucher-table select, table.voucher-table textarea{width:100%; box-sizing:border-box; border:1.5px dashed transparent;
    border-radius:6px; padding:7px 8px; font-size:14px; font-family:inherit; background:transparent; outline:none; color:var(--ink);}
  table.voucher-table textarea{display:block; resize:none; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; line-height:1.5;}
  table.voucher-table input:hover, table.voucher-table select:hover, table.voucher-table textarea:hover{border-color:#c8d8ea;}
  table.voucher-table input:focus, table.voucher-table select:focus, table.voucher-table textarea:focus{border-color:#2c7be5; border-style:solid; background:#fff; box-shadow:0 0 0 3px rgba(44,123,229,.12);}
  table.voucher-table td.vnum{vertical-align:top; padding-top:8px; text-align:right; font-variant-numeric:tabular-nums;}
  table.voucher-table td.vdel{vertical-align:top; padding-top:7px; text-align:center; width:40px;}
  table.voucher-table td.vdel button{background:none; border:none; color:#c0392b; cursor:pointer; font-size:15px; padding:0 5px; border-radius:4px;}
  table.voucher-table td.vdel button:hover{background:#fdecea;}
  table.voucher-table .voucher-empty{text-align:center; color:var(--muted); font-size:13px; padding:22px 10px;}
  .voucher-add{padding-top:10px;}

  /* ===== 业务类别发生额（横向柱状图） ===== */
  .chart-card{margin-top:20px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:16px 18px; box-shadow:0 1px 3px rgba(20,40,30,.05);}
  .chart-card h3{font-size:15px; font-weight:700; color:var(--ink); margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--green-line);}
  .hbar-chart{display:flex; flex-direction:column; gap:10px; padding:4px 2px;}
  .hbar-row{display:grid; grid-template-columns:150px 1fr 120px 60px; align-items:center; gap:12px; font-size:13px;}
  .hbar-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
  .hbar-track{height:20px; background:#eef3f8; border-radius:5px; overflow:hidden;}
  .hbar-fill{height:100%; border-radius:5px; transition:width .25s ease;}
  .hbar-val{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink);}
  .hbar-pct{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums;}
  .hbar-empty{padding:26px; text-align:center; color:var(--muted); font-size:13px;}
  @media(max-width:720px){ .hbar-row{grid-template-columns:96px 1fr 92px 50px; gap:8px;} }



  /* ===== 顶部品牌栏 ===== */
  .brandbar{display:flex; align-items:center; gap:14px; padding:14px 0 18px;}
  .brand-mark{
    width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;
    box-shadow:0 2px 8px rgba(11,122,62,.25); flex:none;
  }
  .brand-text h1{font-size:19px; font-weight:700; letter-spacing:.3px;}
  .brand-text p{font-size:12px; color:var(--muted);}

  /* ===== 期间管理栏 ===== */
  .manager{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    box-shadow:0 1px 3px rgba(20,40,30,.05);
  }
  .tabs{display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1; min-width:200px;}
  .tab{
    display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px;
    border:1px solid var(--line); background:#fafcfa; cursor:pointer; font-size:13px; color:var(--ink);
    transition:all .15s ease; user-select:none;
  }
  .tab:hover{border-color:var(--green); color:var(--green);}
  .tab.active{background:var(--green); border-color:var(--green); color:#fff; font-weight:600;
    box-shadow:0 2px 6px rgba(11,122,62,.3);}
  .tab .del{
    display:none; width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.28);
    color:#fff; font-size:11px; line-height:16px; text-align:center;
  }
  .tab.active .del{display:inline-block;}
  .tab .del:hover{background:#c0392b;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--green);
    background:var(--green); color:#fff; font-size:13px; cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  .btn:hover{background:var(--green-dark); border-color:var(--green-dark);}
  .btn.ghost{background:#fff; color:var(--green);}
  .btn.ghost:hover{background:var(--green-bg);}
  .btn.danger{background:#fff; color:#c0392b; border-color:#c0392b;}
  .btn.danger:hover{background:#c0392b; color:#fff;}
  .toolbar{
    margin-top:12px; background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:14px;
  }
  .toolbar label.chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer;}
  .toolbar input[type=checkbox]{accent-color:var(--green); width:15px; height:15px;}
  .search{
    flex:1; min-width:180px; max-width:340px; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:13px; outline:none; transition:border .15s;
  }
  .search:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(11,122,62,.12);}
  .spacer{flex:1;}

  /* ===== 报表头 ===== */
  .stmt{background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-top:14px; overflow:hidden;
    box-shadow:0 1px 4px rgba(20,40,30,.06);}
  .stmt-head{padding:22px 28px 14px; text-align:center; border-bottom:2px solid var(--green-line); position:relative;}
  .stmt-head .company{font-size:15px; font-weight:600; color:var(--muted); letter-spacing:.4px;}
  .stmt-head h2{font-size:24px; font-weight:700; margin:4px 0 2px;}
  .stmt-head .cn-title{font-size:15px; color:var(--green); font-weight:600;}
  .stmt-head .meta{margin-top:6px; font-size:13px; color:var(--muted); display:flex; justify-content:center; gap:22px; flex-wrap:wrap;}
  .badge{
    position:absolute; right:22px; top:20px; font-size:12px; padding:5px 11px; border-radius:999px; font-weight:600;
  }
  .badge.ok{background:var(--green-bg); color:var(--green); border:1px solid var(--green-line);}
  .badge.warn{background:#fdf0ee; color:var(--neg); border:1px solid #f2c9c2;}
  .badge small{font-weight:400;}

  /* ===== 表格 ===== */
  .tbl-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    position:sticky; top:0; background:#f7faf8; z-index:2; text-align:left; padding:10px 14px;
    border-bottom:2px solid var(--green); color:var(--green-dark); font-size:12.5px; letter-spacing:.5px; white-space:nowrap;
  }
  thead th.num, td.num{text-align:right;}
  tbody td{padding:6px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:#f6faf7;}
  td.code{color:var(--muted); font-family:Consolas,"SF Mono",monospace; font-size:12.5px; white-space:nowrap;}
  td.name{min-width:280px;}
  td.num{font-family:Consolas,"SF Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:13px;}
  td.num.neg{color:var(--neg);}
  td.cn{color:#44554b; min-width:200px;}
  td.cn.editable{cursor:text;}
  td.cn.editable:hover{background:#f2f8f4; outline:1px dashed var(--green-line); outline-offset:-2px;}
  td.cn .placeholder{color:#b9c6bf; font-size:12px;}
  td.cn input{
    width:100%; border:1px solid var(--green); border-radius:6px; padding:4px 8px; font-size:13px; outline:none;
    font-family:inherit; background:#fff;
  }
  .hint-bar{padding:8px 28px; font-size:12px; color:var(--muted); background:#fbfdfb; border-top:1px solid var(--line);}

  /* 层级样式 */
  tr.lv0 td.name{font-weight:700; font-size:14.5px; letter-spacing:.5px;}
  tr.lv0.sec td{background:var(--green); color:#fff; border-bottom:none; padding-top:9px; padding-bottom:9px;}
  tr.lv0.sec td.code{color:rgba(255,255,255,.7);}
  tr.lv1 td.name{font-weight:700;}
  tr.lv1 td{background:#f2f7f4;}
  tr.lv2 td.name{font-weight:600;}
  tr.lv3 td.name{font-weight:600; color:#31463a;}
  tr.lv4 td.name{color:#3c4a42;}
  .indent-0{padding-left:14px;} .indent-1{padding-left:32px;} .indent-2{padding-left:50px;}
  .indent-3{padding-left:70px;} .indent-4{padding-left:92px;}

  tr.total td{font-weight:700; border-top:1px solid #9fb8aa; background:#f7fbf8;}
  tr.grand-total td{font-weight:800; border-top:3px double var(--green-dark); background:var(--green-bg); font-size:14px;}
  tr.grand-total td.num{font-size:14px;}
  tr.collapsed-parent{cursor:pointer;}
  tr.collapsed-parent:hover td{background:#eef5f0;}
  tr.collapsed-parent .toggle-arrow{display:inline-block; margin-right:6px; transition:transform .15s; font-size:11px; color:var(--green-dark);}
  tr.collapsed-parent.collapsed .toggle-arrow{transform:rotate(-90deg);}
  tr.collapsed-child{display:none;}
  tr.pl-group-header td{background:#f2f7f4; font-weight:700; border-top:1px solid #9fb8aa;}
  .pct-col{width:100px; text-align:right; font-family:Consolas,monospace; font-variant-numeric:tabular-nums; color:var(--muted);}

  /* 空状态 */
  .empty{padding:60px 20px; text-align:center; color:var(--muted);}
  .empty .big{font-size:40px; margin-bottom:10px;}

  footer{margin-top:18px; text-align:center; font-size:12px; color:var(--muted);}

  /* ===== 余额表验证弹窗 ===== */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,35,28,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;}
  .modal{background:#fff; border-radius:14px; max-width:1080px; width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.25); overflow:hidden;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; padding:16px 22px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:17px;}
  .modal-head p{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .modal-body{padding:16px 22px; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 22px; border-top:1px solid var(--line); background:#fbfdfb;}
  .modal-foot label.chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer;}
  .modal-foot input[type=checkbox]{accent-color:var(--green);}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .chip{padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:#f7faf8;}
  .chip.ok{background:var(--green-bg); color:var(--green); border-color:var(--green-line);}
  .chip.warn{background:#fdf0ee; color:var(--neg); border-color:#f2c9c2;}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;}
  .pill.ok{background:var(--green-bg); color:var(--green);}
  .pill.diff{background:#fdf0ee; color:var(--neg);}
  .pill.gray{background:#eef1ef; color:var(--muted);}
  .warnbox{border:1px solid #f2c9c2; background:#fdf6f5; border-radius:10px; padding:12px 16px; margin-bottom:14px;}
  .warnbox h4{color:var(--neg); font-size:13.5px; margin-bottom:8px;}
  .vtbl td, .vtbl th{padding:6px 10px;}
  tr.row-diff td{background:#fdf6f5;}

  /* BS/PL 切换条 */
  .stmt-tabs{display:flex; gap:0; margin-bottom:0; border-bottom:2px solid var(--green-line);}
  .stmt-tab{padding:8px 24px; border:none; border-bottom:3px solid transparent; background:transparent;
    font-size:14px; color:var(--muted); cursor:pointer; font-family:inherit; transition:all .15s; margin-bottom:-2px;}
  .stmt-tab:hover{color:var(--green-dark); background:var(--green-bg);}
  .stmt-tab.active{color:var(--green-dark); border-bottom-color:var(--green); font-weight:700;}
  .stmt-tab.disabled{opacity:.4; cursor:not-allowed;}
  .stmt-tab.disabled:hover{background:transparent; color:var(--muted);}

  /* ===== 币种汇总 ===== */
  .cur-section{margin-bottom:20px;}
  .cur-section h4{font-size:14px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;}
  .cur-badge{display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:700; letter-spacing:.5px;}
  .cur-IDR{background:#e8f5e9; color:#1b7a3e;}
  .cur-CNY{background:#fce8e6; color:#c0392b;}
  .cur-USD{background:#e3edf7; color:#1a5276;}
  .cur-OTHER{background:#eef1ef; color:#6b7a71;}
  .bar-row{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px;}
  .bar-label{width:60px; text-align:right; font-weight:600; flex:none;}
  .bar-track{flex:1; height:24px; background:#f0f4f2; border-radius:6px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:6px; transition:width .3s ease; display:flex; align-items:center; padding-left:8px; color:#fff; font-size:12px; font-weight:600; white-space:nowrap;}
  .bar-fill.IDR{background:linear-gradient(90deg,#0b7a3e,#1b9e54);}
  .bar-fill.CNY{background:linear-gradient(90deg,#c0392b,#e74c3c);}
  .bar-fill.USD{background:linear-gradient(90deg,#1a5276,#2980b9);}
  .bar-fill.OTHER{background:linear-gradient(90deg,#6b7a71,#95a5a6);}
  .bar-amount{width:180px; text-align:right; font-family:Consolas,monospace; font-variant-numeric:tabular-nums; flex:none;}
  .bar-pct{width:60px; font-size:12px; color:var(--muted); flex:none;}
  .cur-table{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;}
  .cur-table th{text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); color:var(--green-dark); font-size:12px;}
  .cur-table td{padding:5px 10px; border-bottom:1px solid var(--line);}
  .cur-table td.num{font-family:Consolas,monospace; text-align:right; font-variant-numeric:tabular-nums;}
  .cur-inferred{font-size:11px; color:var(--muted); background:#f7faf8; padding:1px 6px; border-radius:4px; margin-left:4px;}


  /* ===== 应用级功能切换（G Logo） ===== */
  .brand-mark{cursor:pointer; transition:transform .15s, box-shadow .15s; user-select:none;}
  .brand-mark:hover{transform:scale(1.06); box-shadow:0 4px 14px rgba(11,122,62,.38);}
  .brand-mark:active{transform:scale(.96);}
  .brand-hint{font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:999px;
    padding:3px 10px; background:#fafcfa; white-space:nowrap; margin-left:auto;}
  .app-view{display:none;}
  .app-view.active{display:block;}
  .layout.report-mode{max-width:920px;}
  .layout.report-mode .sidebar{display:none;}

  /* ===== 工作日报 ===== */
  #appReport{background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:26px 30px 30px; box-shadow:0 1px 4px rgba(20,40,30,.06);}
  #appReport .date-row{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  #appReport .date-row label{font-weight:600; font-size:14px;}
  #appReport .date-row input{padding:7px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; color:var(--ink);}
  #appReport .date-row input:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(11,122,62,.12);}
  #appReport .section{margin-bottom:20px; border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; background:#fbfdfb;}
  #appReport .section h2{font-size:16px; font-weight:700; color:var(--ink); margin-bottom:12px;
    padding-bottom:8px; border-bottom:2px solid var(--green-line);}
  #appReport .item{display:flex; gap:10px; margin-bottom:10px; align-items:flex-start;}
  #appReport .item .num{flex:none; width:38px; padding-top:9px; font-weight:600; color:var(--green);
    font-size:14px; text-align:right;}
  #appReport .item .content{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
  #appReport .item textarea{width:100%; min-height:60px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; font-size:15px; font-family:"Microsoft YaHei",inherit; resize:vertical;
    line-height:1.75; color:var(--ink); background:#fff; outline:none;}
  #appReport .item textarea:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(11,122,62,.12);}
  #appReport .img-list{display:flex; flex-direction:column; gap:10px;}
  #appReport .img-wrap{display:flex; flex-direction:column; align-items:flex-start; gap:4px;}
  #appReport .img-preview{max-width:100%; max-height:200px; border-radius:6px; border:1px solid var(--line); display:block;}
  #appReport .img-actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  #appReport .img-actions label{font-size:13px; color:var(--green); cursor:pointer;}
  #appReport .img-actions label:hover{text-decoration:underline;}
  #appReport .img-actions input[type=file]{display:none;}
  #appReport .paste-btn{background:none; border:none; color:var(--green); cursor:pointer; font-size:13px;
    padding:0; font-family:inherit;}
  #appReport .paste-btn:hover{text-decoration:underline;}
  #appReport .remove-img{background:none; border:none; color:var(--neg); cursor:pointer; font-size:13px; padding:0;}
  #appReport .item .del-btn{flex:none; background:#fff1f0; color:var(--neg); border:1px solid #ffa39e;
    border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:16px; margin-top:6px;
    display:flex; align-items:center; justify-content:center;}
  #appReport .item .del-btn:hover{background:#ffccc7;}
  #appReport .add-btn{background:var(--green-bg); color:var(--green); border:1px dashed var(--green-line);
    border-radius:8px; padding:8px 16px; cursor:pointer; font-size:13.5px; width:100%; margin-top:4px;
    font-family:inherit;}
  #appReport .add-btn:hover{background:#d8ecdf;}
  #appReport .actions{display:flex; gap:12px; margin-top:24px; justify-content:center; flex-wrap:wrap;}
  #appReport .export-btn{background:var(--green); color:#fff; border:none; border-radius:8px;
    padding:11px 32px; font-size:14.5px; cursor:pointer; font-weight:600; font-family:inherit;}
  #appReport .export-btn:hover{background:var(--green-dark);}
  #appReport .export-btn:disabled{background:#bbb; cursor:not-allowed;}
  #appReport .clear-btn{background:#fff; color:var(--muted); border:1px solid var(--line); border-radius:8px;
    padding:11px 24px; font-size:14.5px; cursor:pointer; font-family:inherit;}
  #appReport .clear-btn:hover{background:#f5f5f5;}
  #appReport .status{text-align:center; margin-top:12px; font-size:13px; color:var(--green); min-height:20px;}

  @media print{
    body{background:#fff;}
    .manager,.toolbar,.hint-bar,footer,.del{display:none !important;}
    .stmt{border:none; box-shadow:none; margin-top:0;}
    .badge{position:static; display:inline-block; margin-top:6px;}
    thead th{position:static;}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- 侧边栏导航 -->
  <nav class="sidebar">
    <div class="side-title">导航 NAVIGATION</div>
    <button class="side-item group" data-group="stmt"><span class="arrow">▼</span><span class="ico">📊</span>报表查看</button>
    <div class="side-children" id="grp-stmt">
      <button class="side-item sub active" data-page="stmt:bs">资产负债表 (BS)</button>
      <button class="side-item sub" data-page="stmt:pl" id="navPL">利润表 (PL)</button>
    </div>
    <button class="side-item" data-page="wpRma"><span class="ico">🧾</span>RMA费用底稿</button>
    <button class="side-item" data-page="wpRepair"><span class="ico">🔧</span>维修费底稿</button>
    <button class="side-item" data-page="wpWarranty"><span class="ico">🛡️</span>保修费底稿</button>
    <button class="side-item" data-page="wpSpare"><span class="ico">⚙️</span>备件费底稿</button>
    <button class="side-item" data-page="wpInstall"><span class="ico">🎁</span>安装奖励底稿</button>
    <button class="side-item" data-page="wpTraining"><span class="ico">🎓</span>培训费底稿</button>
    <button class="side-item" data-page="wpIncentive"><span class="ico">💰</span>销售激励底稿</button>
    <button class="side-item" data-page="wpVehicleRepair"><span class="ico">🚗</span>车辆维修费底稿</button>
  </nav>

  <div class="wrap">

  <div class="brandbar">
    <div class="brand-mark" id="brandMark" title="点击切换到：工作日报工具">G</div>
    <div class="brand-text">
      <h1 id="brandTitle">审计工具</h1>
      <p id="brandSub">Audit Tool · 支持多期间报表导入 / 切换 / 中英科目对照</p>
    </div>
    <span class="brand-hint">点击 G 切换功能</span>
  </div>

  <div class="app-view active" id="appFin">
  <!-- 期间管理 -->
  <div class="manager">
    <div class="tabs" id="tabs"></div>
    <button class="btn" id="btnImport">＋ 导入报表 (Excel)</button>
    <button class="btn ghost" id="btnBackup" title="将全部期间数据导出为 JSON 文件备份">备份数据</button>
    <button class="btn ghost" id="btnRestore" title="从 JSON 备份文件恢复数据">恢复数据</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" multiple style="display:none">
    <input type="file" id="restoreInput" accept=".json" style="display:none">
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input class="search" id="search" placeholder="搜索科目编码 / 英文名称 / 中文名称…">
    <label class="chk"><input type="checkbox" id="hideZero"> 隐藏零余额科目</label>
    <div class="spacer"></div>
    <button class="btn" id="btnVerify">✓ 余额表验证</button>
    <input type="file" id="tbInput" accept=".xlsx,.xls" style="display:none">
    <button class="btn ghost" id="btnPrint">🖨 打印</button>
  </div>

  <!-- 报表主体 -->
  <div class="stmt" id="stmt"></div>

  <!-- 费用类底稿（问题页） -->
  <div class="wp-page" id="wpRma"></div>
  <div class="wp-page" id="wpRepair"></div>
  <div class="wp-page" id="wpWarranty"></div>

  <div class="wp-page" id="wpSpare"></div>
  <div class="wp-page" id="wpInstall"></div>
  <div class="wp-page" id="wpTraining"></div>
  <div class="wp-page" id="wpIncentive"></div>
  <div class="wp-page" id="wpVehicleRepair"></div>

  <footer>数据保存在本浏览器本地（localStorage）· 中文科目列可双击编辑并自动保存 · 建议定期点击「备份数据」</footer>
  </div><!-- /appFin -->

  <!-- 工作日报 -->
  <div class="app-view" id="appReport">
    <div class="date-row">
      <label>日期：</label>
      <input type="date" id="drDate">
    </div>

    <div class="section" data-section="today">
      <h2>今日工作</h2>
      <div class="items"></div>
      <button class="add-btn">+ 添加条目</button>
    </div>

    <div class="section" data-section="tomorrow">
      <h2>明日计划</h2>
      <div class="items"></div>
      <button class="add-btn">+ 添加条目</button>

const LS_PERIODS = 'fsv.periods.v1', LS_OVR = 'fsv.cnOverrides.v1', LS_ACTIVE = 'fsv.active.v1';

/* 旧版按期间保存的底稿数据 → 合并为全局一份（不与期间联动） */
function migrateWP(raw){
  if(!raw || Array.isArray(raw)) return {};
  let old = false;
  for(const k of Object.keys(raw))
    if(/^\d{4}-\d{2}-\d{2}/.test(k) || k.startsWith('未命名期间')){ old = true; break; }
  if(!old) return raw;
  const out = {};
  for(const per of Object.values(raw))
    for(const [code, v] of Object.entries(per || {}))
      out[code] = {...(out[code] || {}), ...v};
  return out;
}

/* =====================================================

===================================================== */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtAmt(n){
  if(n === null || n === undefined) return '';
  if(n === 0) return '<span style="color:#b9c6bf">-</span>';
  const abs = Math.abs(n).toLocaleString('en-US');
  return n < 0 ? `(${abs})` : abs;
}
function fmtAmtRaw(n){
  if(n === null || n === undefined) return '';
  return n.toLocaleString('en-US');
}
function cnKeyOf(row){ return row.code ? row.code : ('name:' + row.en); }
function cnFor(row){
  const k = cnKeyOf(row);
  if(stmtTab === 'pl') return OVR[k] ?? CN_PL_CODE[row.code] ?? CN_PL_NAME[row.en] ?? '';
  return OVR[k] ?? CN_CODE[row.code] ?? CN_NAME[row.en] ?? '';
}
function isTotalName(en){ return /^Total\s/i.test(en || ''); }
function periodLabel(key){
  const m = key.match(/(20\d{2})-(\d{2})/);
  return m ? `${m[1]}年${parseInt(m[2])}月` : key;
}

/* =====================================================
   五、Excel 解析（导入新期间）
===================================================== */
function parseWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  let company = '', title = '', date = '', isPL = false;
  const pad = n => String(n).padStart(2,'0');
  for(let r = 0; r < Math.min(8, aoa.length); r++){
    const row = aoa[r] || [];
    for(let ci = row.length - 1; ci >= 0; ci--){
      const cell = row[ci];
      if(cell === null || cell === undefined) continue;
      const s = String(cell).trim();
      if(/单位[:：]/.test(s)) company = s.replace(/单位[:：]/,'').trim();
      else if(/balance sheet/i.test(s) && !title){ title = s; isPL = false; }
      else if(/profit/i.test(s) && !title){ title = s; isPL = true; }
      else if(!date){
        if(cell instanceof Date && !isNaN(cell)) date = `${cell.getFullYear()}-${pad(cell.getMonth()+1)}-${pad(cell.getDate())}`;
        else {
          const m = s.match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
          if(m) date = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
          else if(typeof cell === 'number' && cell > 40000 && cell < 60000){
            const d = XLSX.SSF.parse_date_code(cell);
            if(d) date = `${d.y}-${pad(d.m)}-${pad(d.d)}`;
          }
        }
      }
    }
  }
  const rows = [];
  /* 动态检测列偏移：XLSX 可能跳过空的 A 列导致整体左移 */
  let offset = 0;
  for(let r = 4; r < Math.min(30, aoa.length); r++){
    const row = aoa[r] || [];
    for(let c = 0; c < Math.min(3, row.length); c++){
      const v = row[c];
      if(v !== null && v !== undefined && /^\d{4,6}$/.test(String(v).trim())){
        offset = c - 1;   /* code 预期在列 1，实际在列 c → 偏移量 */
        break;
      }
    }
    if(offset !== 0) break;
  }
  /* BS: C-H → lv0-4, amount col I(8); PL: D-G → lv0-3, amount col J(9) */
  const lvMap = {};
  const baseLvMap = isPL ? {3:0, 4:1, 5:2, 6:3} : {2:0, 3:1, 4:2, 5:3, 6:4, 7:4};
  for(const [c, lv] of Object.entries(baseLvMap)) lvMap[+c + offset] = lv;
  const amtCol = (isPL ? 9 : 8) + offset;
  const nameStart = (isPL ? 3 : 2) + offset;
  const nameEnd = (isPL ? 6 : 7) + offset;
  for(let r = 4; r < aoa.length; r++){
    const row = aoa[r] || [];
    let code = row[1 + offset];
    code = (code === null || code === undefined) ? '' : String(code).trim();
    let en = null, lv = null;
    for(let c = nameStart; c <= nameEnd; c++){
      const v = row[c];
      if(v !== null && v !== undefined && String(v).trim() !== ''){ en = String(v).trim(); lv = lvMap[c]; break; }
    }
    let amt = row[amtCol];
    amt = (typeof amt === 'number' && isFinite(amt)) ? Math.round(amt) : null;
    if(en === null && code === '') continue;
    if(en !== null && /^0+$/.test(en)) continue;
    rows.push({lv: lv ?? (isPL ? 3 : 4), code, en: en ?? '', amt});
  }
  if(!rows.length) throw new Error('未能从文件中识别到报表数据，请确认文件格式与本期报表一致');
  return {company: company || '未知公司', title: title || (isPL ? 'Profit and Loss' : 'Balance Sheet'), date, rows, isPL};
}

/* =====================================================
   五·二、科目余额表解析与验证
   符号规则：资产类(1开头) 借方正；负债/权益类(2/3开头) 贷方正
===================================================== */
function parseTB(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  let hr = -1, period = '';
  for(let r = 0; r < Math.min(12, aoa.length); r++){
    const row = aoa[r] || [];
    if(row.some(c => c !== null && String(c).trim() === 'Acct Code')){ hr = r; break; }
    for(const c of row){
      const m = String(c ?? '').match(/(20\d{2}-\d{2})\s*--\s*(20\d{2}-\d{2})/);
      if(m) period = m[2];
    }
  }
  if(hr < 0) throw new Error('未找到余额表表头（Acct Code 行），请确认文件格式');
  const num = v => (typeof v === 'number' && isFinite(v)) ? Math.round(v) : 0;
  const accounts = {};
  for(let r = hr + 1; r < aoa.length; r++){
    const row = aoa[r] || [];
    const code = String(row[0] ?? '').trim();
    if(!code || /^total/i.test(code)) continue;
    const nameRaw = String(row[1] ?? '').trim();
    accounts[code] = {
      name: nameRaw.includes('\\') ? nameRaw.split('\\').slice(1).join('\\') : nameRaw,
      open: num(row[3]), debit: num(row[4]), credit: num(row[5]),
      closeDir: String(row[8] ?? '').trim(), closing: num(row[9])
    };
  }
  return {period, accounts};
}
/* 余额表科目 → 报表口径带符号金额 */
function tbBsValue(code, a){
  const signed = a.closeDir === 'Debit' ? a.closing : a.closeDir === 'Credit' ? -a.closing : 0; // 借方正
  return code[0] === '1' ? signed : -signed;
}
function tbPlValue(code, a){
  /* 利润表口径：收入(4xxx/71xx)贷方为正、成本费用(5-7xxx除71)借方为正，与报表一致 */
  const isRevenue = code[0] === '4' || (code[0] === '7' && code[1] === '1');
  if(isRevenue) return a.closeDir === 'Credit' ? a.closing : -a.closing;
  return a.closeDir === 'Debit' ? a.closing : -a.closing;
}
function verifyTB(p){
  const tb = p.tb.accounts;
  const bsCodes = p.rows.filter(r => r.code).map(r => r.code);
  const plRows = p.pl || [];
  const plCodes = plRows.filter(r => r.code).map(r => r.code);
  const allCodes = new Set([...bsCodes, ...plCodes]);
  const isGroup = (code, codes) => codes.some(o => o.length > code.length && o.startsWith(code));
  const results = [];
  /* BS 科目核对 */
  for(const row of p.rows){
    if(!row.code || row.amt === null || row.amt === undefined) continue;
    let expected = null, note = '';
    if(isGroup(row.code, bsCodes)){
      expected = 0; note = '汇总';
      for(const [tc, ta] of Object.entries(tb))
        if(tc.length > row.code.length && tc.startsWith(row.code)) expected += tbBsValue(tc, ta);
    }else{
      const ta = tb[row.code];
      if(ta) expected = tbBsValue(row.code, ta);
    }
    if(expected === null){
      if(row.amt !== 0) results.push({code: row.code, en: row.en, bs: row.amt, tb: null, diff: null, status: 'noTb', note, stmt: 'BS'});
      continue;
    }
    const diff = row.amt - expected;
    results.push({code: row.code, en: row.en, bs: row.amt, tb: expected, diff,
      status: Math.abs(diff) < 1 ? 'ok' : 'diff', note, stmt: 'BS'});
  }
  /* PL 科目核对 */
  for(const row of plRows){
    if(!row.code || row.amt === null || row.amt === undefined) continue;
    let expected = null, note = '';
    if(isGroup(row.code, plCodes)){
      expected = 0; note = '汇总';
      for(const [tc, ta] of Object.entries(tb))
        if(tc.length > row.code.length && tc.startsWith(row.code)) expected += tbPlValue(tc, ta);
    }else{
      const ta = tb[row.code];
      if(ta) expected = tbPlValue(row.code, ta);
    }
    if(expected === null){
      if(row.amt !== 0) results.push({code: row.code, en: row.en, bs: row.amt, tb: null, diff: null, status: 'noTb', note, stmt: 'PL'});
      continue;
    }
    const diff = row.amt - expected;
    results.push({code: row.code, en: row.en, bs: row.amt, tb: expected, diff,
      status: Math.abs(diff) < 1 ? 'ok' : 'diff', note, stmt: 'PL'});
  }
  /* 损益类净额 vs 报表「Current Retained Earning」 */
  let pl = null;
  const cre = p.rows.find(r => r.en === 'Current Retained Earning');
  if(cre){
    let s = 0;
    for(const [tc, ta] of Object.entries(tb))
      if('4567'.includes(tc[0])) s += ta.closeDir === 'Credit' ? ta.closing : -ta.closing;
    pl = {bs: cre.amt, tb: s, diff: cre.amt - s};
  }
  /* 余额表非零但报表未列示的科目 */
  const listed = new Set(allCodes);
  const unlisted = [];
  for(const [tc, ta] of Object.entries(tb)){
    if(!'1234567'.includes(tc[0]) || listed.has(tc)) continue;
    const v = '123'.includes(tc[0]) ? tbBsValue(tc, ta) : tbPlValue(tc, ta);
    if(v !== 0) unlisted.push({code: tc, en: ta.name, tb: v, stmt: '123'.includes(tc[0]) ? 'BS' : 'PL'});
  }
  return {results, pl, unlisted};
}

  for(const a of Object.values(p.tb.accounts)){

  }

  /* BS/PL 勾稽：本年利润 vs 税后净利润 */

  const cre = p.rows.find(r => r.en === 'Current Retained Earning');
  const npt = (p.pl || []).find(r => r.en === 'NET PROFIT/LOSS (After Tax)');
  if(cre && npt){

    html += '<div class="chips">';

    html += '</div>';
  }
  html += '<div class="chips">';
  html += `<span class="chip ${tbBalanced ? 'ok' : 'warn'}">余额表借贷${tbBalanced ? '平衡 ✓' : `不平 ✗ (借 ${td.toLocaleString('en-US')} ≠ 贷 ${tc.toLocaleString('en-US')})`}</span>`;
  html += `<span class="chip ok">✓ 一致 ${okN} 项</span>`;
  if(diffN) html += `<span class="chip warn">⚠ 差异 ${diffN} 项</span>`;
  if(noTbN) html += `<span class="chip warn">⊘ 余额表缺失 ${noTbN} 项</span>`;
  if(v.unlisted.length) html += `<span class="chip warn">⚠ 报表未列示 ${v.unlisted.length} 项</span>`;
  if(v.pl){
    const good = Math.abs(v.pl.diff) < 1;
    html += `<span class="chip ${good ? 'ok' : 'warn'}">${good ? '✓' : '⚠'} 本年利润勾稽：报表 ${v.pl.bs.toLocaleString('en-US')} ${good ? '=' : '≠'} 损益类净额 ${v.pl.tb.toLocaleString('en-US')}${good ? '' : ` (差异 ${v.pl.diff.toLocaleString('en-US')})`}</span>`;
  }
  html += '</div>';
  if(v.unlisted.length){
    html += '<div class="warnbox"><h4>⚠ 以下科目在余额表中期末余额非零，但未按编码列示于报表（可能导致报表不平衡）：</h4>'
      + '<table class="vtbl"><thead><tr><th>报表</th><th>科目编码</th><th>科目名称</th><th class="num">期末余额 (报表口径)</th></tr></thead><tbody>';
    for(const u of v.unlisted)
      html += `<tr><td>${esc(u.stmt)}</td><td class="code">${esc(u.code)}</td><td>${esc(u.en)}</td><td class="num">${fmtAmt(u.tb)}</td></tr>`;
    html += '</tbody></table></div>';
  }
  const rows = v.results.filter(r => !onlyDiff || r.status !== 'ok');
  html += '<table class="vtbl"><thead><tr><th>报表</th><th>科目编码</th><th>科目名称</th><th class="num">报表金额</th><th class="num">余额表期末 (报表口径)</th><th class="num">差异</th><th>状态</th></tr></thead><tbody>';
  for(const r of rows){
    const st = r.status === 'ok' ? '<span class="pill ok">✓ 一致</span>'
      : r.status === 'diff' ? '<span class="pill diff">⚠ 差异</span>' : '<span class="pill gray">⊘ 余额表缺失</span>';
    const diffCell = r.diff === null ? '—' : (Math.abs(r.diff) < 1 ? '-' : fmtAmt(r.diff));
    html += `<tr class="${r.status === 'diff' ? 'row-diff' : ''}">
      <td>${esc(r.stmt)}</td>
      <td class="code">${esc(r.code)}${r.note === '汇总' ? ' <span style="color:#8a9a91;font-size:11px">(汇总)</span>' : ''}</td>
      <td>${esc(r.en)}</td><td class="num">${fmtAmt(r.bs)}</td>
      <td class="num">${r.tb === null ? '—' : fmtAmt(r.tb)}</td>
      <td class="num ${r.diff !== null && Math.abs(r.diff) >= 1 ? 'neg' : ''}">${diffCell}</td><td>${st}</td></tr>`;
  }
  html += `</tbody></table>${rows.length ? '' : '<p style="text-align:center;color:#8a9a91;padding:20px">全部一致，无差异项</p>'}`;
  $('#vBody').innerHTML = html;
}

  if(typeof XLSX === 'undefined'){ alert('Excel 解析库加载失败（需要联网加载 SheetJS）。请检查网络后刷新页面重试。'); return; }
  let ok = 0, fail = [];

        if(PERIODS[key]){
          PERIODS[key].pl = p.rows;
        }else{
          PERIODS[key] = {company: p.company, title: 'Balance Sheet', date: key, rows: [], pl: p.rows};
        }
        activeKey = key; ok++;

/* =====================================================
   八、银行存款按币种汇总
===================================================== */
/* 从科目名称推断币种：优先匹配显式标注，无标注的印尼本土银行账户推断为 IDR */
const CUR_ORDER = ['IDR', 'CNY', 'USD', 'OTHER'];
const CUR_LABEL = {IDR: '印尼盾 (IDR)', CNY: '人民币 (CNY)', USD: '美元 (USD)', OTHER: '其他/未明确'};
function parseCurrency(en){
  const s = (en || '').toUpperCase();
  if(/\bUSD\b/.test(s) || s.includes('PETTY CASH USD')) return 'USD';
  if(/\bCNY\b/.test(s)) return 'CNY';
  if(/\bIDR\b/.test(s) || s.includes('PETTY CASH IDR')) return 'IDR';
  /* 无显式币种标注：印尼公司主体，银行账户默认 IDR */
  return 'IDR';
}
function isBankAccount(row){
  /* 100001~100099 范围内的末级科目（6位编码），排除 100000（汇总）和 100098/100099 等特殊科目仍保留 */
  if(!row.code || row.code.length < 6) return false;
  if(!row.code.startsWith('1000')) return false;
  if(row.code === '100000') return false;
  return true;
}
function renderCurrency(){
  const p = PERIODS[activeKey];
  if(!p){ alert('请先选择报表期间'); return; }
  /* 收集银行存款科目 */
  const bankRows = p.rows.filter(isBankAccount);
  /* 按币种分组 */
  const groups = {};
  for(const row of bankRows){
    const cur = parseCurrency(row.en);
    if(!groups[cur]) groups[cur] = [];
    groups[cur].push(row);
  }
  /* 计算汇总 */
  const summary = {};
  let grandTotal = 0;
  for(const cur of CUR_ORDER){
    if(!groups[cur]) continue;
    let sum = 0;
    for(const r of groups[cur]) sum += r.amt || 0;
    summary[cur] = {sum, count: groups[cur].length};
    grandTotal += sum;
  }
  /* 余额表数据（如有）提供更丰富信息 */
  const tb = p.tb ? p.tb.accounts : null;
  /* 渲染 */
  $('#cSub').textContent = `报表期间：${periodLabel(activeKey)} (${activeKey}) · 银行账户数：${bankRows.length} · 金额单位：印尼盾 (折算后)`;
  let html = '';
  /* 概览条形图 */
  html += '<div class="cur-section"><h4>📊 币种分布概览</h4>';
  for(const cur of CUR_ORDER){
    if(!summary[cur]) continue;
    const s = summary[cur];
    const pct = grandTotal > 0 ? (s.sum / grandTotal * 100) : 0;
    const barW = Math.max(pct, 2);
    html += `<div class="bar-row">
      <div class="bar-label"><span class="cur-badge cur-${cur}">${cur}</span></div>
      <div class="bar-track"><div class="bar-fill ${cur}" style="width:${barW}%">${pct.toFixed(1)}%</div></div>
      <div class="bar-amount">${fmtAmt(s.sum)}</div>
      <div class="bar-pct">${s.count} 个账户</div>
    </div>`;
  }
  html += `<div class="bar-row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">
    <div class="bar-label" style="font-weight:700">合计</div>
    <div class="bar-track" style="background:transparent"></div>
    <div class="bar-amount" style="font-weight:700">${fmtAmt(grandTotal)}</div>
    <div class="bar-pct">${bankRows.length} 个</div>
  </div></div>`;
  /* 分币种明细 */
  for(const cur of CUR_ORDER){
    if(!groups[cur]) continue;
    const rows = groups[cur];
    html += `<div class="cur-section"><h4><span class="cur-badge cur-${cur}">${cur}</span> ${CUR_LABEL[cur]} — ${summary[cur].count} 个账户，合计 ${fmtAmt(summary[cur].sum)}</h4>`;
    html += '<table class="cur-table"><thead><tr><th style="width:90px">科目编码</th><th>账户名称</th>';
    if(tb) html += '<th class="num" style="width:120px">期初余额</th><th class="num" style="width:120px">借方发生</th><th class="num" style="width:120px">贷方发生</th>';
    html += '<th class="num" style="width:160px">期末余额 (报表)</th><th style="width:60px">币种</th></tr></thead><tbody>';
    for(const r of rows){
      const inferred = parseCurrency(r.en) === cur && !/\b(IDR|CNY|USD)\b/i.test(r.en);
      const ta = tb ? tb[r.code] : null;
      html += `<tr>
        <td class="code">${esc(r.code)}</td>
        <td>${esc(r.en)}</td>`;
      if(tb) html += `<td class="num">${ta ? fmtAmt(ta.open) : '—'}</td><td class="num">${ta ? fmtAmt(ta.debit) : '—'}</td><td class="num">${ta ? fmtAmt(ta.credit) : '—'}</td>`;
      html += `<td class="num ${r.amt < 0 ? 'neg' : ''}">${fmtAmt(r.amt)}</td>
        <td><span class="cur-badge cur-${cur}">${cur}</span>${inferred ? '<span class="cur-inferred">推断</span>' : ''}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }
  $('#cBody').innerHTML = html;
  $('#cModal').style.display = 'flex';
}

    if(!isFinite(amt) || amt <= 0) return;
    map.set(label, (map.get(label) || 0) + amt);
  });
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}

/* ===== 比率分析：同比 ===== */
let RATIO_CUR = '', RATIO_PREV = '';
function plPeriodKeys(){
  return Object.keys(PERIODS).filter(k => PERIODS[k] && Array.isArray(PERIODS[k].pl) && PERIODS[k].pl.length).sort();
}
function ratioYM(key){
  const m = key.match(/(20\d{2})-(\d{2})/);
  return m ? {y:+m[1], m:m[2]} : null;
}
function sameMonthLastYear(cur, keys){
  const ym = ratioYM(cur);
  if(!ym) return '';
  return keys.find(k => { const o = ratioYM(k); return o && o.y === ym.y - 1 && o.m === ym.m; }) || '';
}
function ensureRatioSel(){
  const keys = plPeriodKeys();
  if(!keys.length){ RATIO_CUR = RATIO_PREV = ''; return keys; }
  if(!keys.includes(RATIO_CUR)) RATIO_CUR = (activeKey && keys.includes(activeKey)) ? activeKey : keys[keys.length - 1];
  if(!keys.includes(RATIO_PREV) || RATIO_PREV === RATIO_CUR){
    const earlier = keys.filter(k => k < RATIO_CUR);
    RATIO_PREV = sameMonthLastYear(RATIO_CUR, keys)
      || earlier[earlier.length - 1]
      || keys.find(k => k !== RATIO_CUR)
      || '';
  }
  return keys;
}
function plByCode(key){
  const m = new Map();
  (PERIODS[key]?.pl || []).forEach(r => {
    if(!r || !r.code || isTotalName(r.en)) return;
    m.set(String(r.code), r);
  });
  return m;
}
function ratioCnFor(row){
  if(!row) return '';
  return OVR[cnKeyOf(row)] ?? CN_PL_CODE[row.code] ?? CN_PL_NAME[row.en] ?? '';
}
function ratioPageHtml(){
  const scoped = (DEF().accounts || []).map(String);
  const keys = ensureRatioSel();
  if(!keys.length){
    return '<div class="ratio-block"><div class="empty"><div class="big">📈</div>暂无上传的利润表数据，请先在报表页导入报表后再进行同比分析</div></div>';
  }
  if(!scoped.length){
    return '<div class="ratio-block"><div class="empty"><div class="big">📈</div>该底稿尚未配置科目编码，暂无法进行同比分析</div></div>';
  }
  const cur = plByCode(RATIO_CUR), prev = plByCode(RATIO_PREV);
  const rateOf = (ca, pa) => pa === 0 ? (ca === 0 ? null : Infinity) : (ca - pa) / Math.abs(pa) * 100;
  const rateText = r => r === null || r === undefined ? '—' : r === Infinity ? '新增' : (r > 0 ? '+' : '') + r.toFixed(1) + '%';
  const rateCls = r => r === null || r === undefined || r === Infinity ? '' : (r > 0 ? 'up' : r < 0 ? 'down' : '');
  const buildRows = codes => {
    const out = [];
    codes.forEach(code => {
      const a = cur.get(code), b = prev.get(code);
      const ca = +(a?.amt || 0), pa = +(b?.amt || 0);
      if(!ca && !pa) return;
      out.push({code, en:(a?.en || b?.en || ''), cn:ratioCnFor(a || b), ca, pa, diff:ca - pa, rate:rateOf(ca, pa)});
    });
    return out.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  };
  const rowHtml = r => `
      <tr>
        <td class="code">${esc(r.code)}</td>
        <td><div class="ratio-en">${esc(r.en)}</div>${r.cn ? `<div class="ratio-cn">${esc(r.cn)}</div>` : ''}</td>
        <td class="num ${r.ca < 0 ? 'neg' : ''}">${fmtAmt(r.ca)}</td>
        <td class="num ${r.pa < 0 ? 'neg' : ''}">${fmtAmt(r.pa)}</td>
        <td class="num ${r.diff < 0 ? 'neg' : ''}">${fmtAmt(r.diff)}</td>
        <td class="num ${rateCls(r.rate)}">${rateText(r.rate)}</td>
      </tr>`;
  const emptyRow = msg => `<tr><td colspan="6" style="text-align:center;padding:30px;color:#8a9a91">${msg}</td></tr>`;

  const allCodes = [...new Set([...cur.keys(), ...prev.keys()])];
  const expRows = buildRows(allCodes.filter(c => scoped.includes(String(c))));
  const revCodes = allCodes.filter(c => String(c).startsWith('4'));
  const revLeaves = revCodes.filter(c => !revCodes.some(d => d !== c && d.startsWith(c)));
  const revRows = buildRows(revLeaves);

  const expCA = expRows.reduce((s, r) => s + r.ca, 0), expPA = expRows.reduce((s, r) => s + r.pa, 0);
  const revCA = revRows.reduce((s, r) => s + r.ca, 0), revPA = revRows.reduce((s, r) => s + r.pa, 0);
  const expRate = rateOf(expCA, expPA), revRate = rateOf(revCA, revPA);
  const gap = (expRate === null || revRate === null || expRate === Infinity || revRate === Infinity) ? null : expRate - revRate;
  let status = '数据不足', statusCls = 'gray', conclusion = '所选期间缺少费用或收入数据，暂无法判断匹配性。';
  if(gap !== null){
    if(Math.abs(gap) <= 10){ status = '基本匹配'; statusCls = 'ok';
      conclusion = '费用与收入的变动幅度差异在 10 个百分点以内，变动趋势基本一致。'; }
    else if(gap > 0){ status = '费用增幅高于收入'; statusCls = 'warn';
      conclusion = `费用增幅比收入增幅高 ${gap.toFixed(1)} 个百分点，建议结合抽凭核查费用增长原因。`; }
    else { status = '费用增幅低于收入'; statusCls = 'warn';
      conclusion = `费用增幅比收入增幅低 ${Math.abs(gap).toFixed(1)} 个百分点，建议关注费用归集完整性。`; }
  } else if(revRate === Infinity || expRate === Infinity){
    status = '需关注'; statusCls = 'warn';
    conclusion = '存在对比期无基数的新增或消失金额，建议结合抽凭核查。';
  }

  const opt = k => `<option value="${esc(k)}"${k === RATIO_CUR ? ' selected' : ''}>${esc(periodLabel(k))}</option>`;
  const optPrev = k => `<option value="${esc(k)}"${k === RATIO_PREV ? ' selected' : ''}>${esc(periodLabel(k))}</option>`;
  const expBody = expRows.length ? expRows.map(rowHtml).join('') : emptyRow('本底稿科目在所选期间均无数据');
  const revBody = revRows.length
    ? revRows.map(rowHtml).join('') + `<tr class="ratio-total"><td></td><td>收入合计</td>
        <td class="num ${revCA < 0 ? 'neg' : ''}">${fmtAmt(revCA)}</td>
        <td class="num ${revPA < 0 ? 'neg' : ''}">${fmtAmt(revPA)}</td>
        <td class="num ${(revCA - revPA) < 0 ? 'neg' : ''}">${fmtAmt(revCA - revPA)}</td>
        <td class="num ${rateCls(revRate)}">${rateText(revRate)}</td></tr>`
    : emptyRow('所选期间无收入类科目数据');

  return `
    <div class="ratio-block">
      <div class="ratio-bar">
        <div class="ratio-field"><span>本期期间</span><select data-ratio="cur">${keys.map(opt).join('')}</select></div>
        <div class="ratio-field"><span>对比期间</span><select data-ratio="prev">${keys.filter(k => k !== RATIO_CUR).map(optPrev).join('')}</select></div>
        <span class="chip">按底稿科目编码：${scoped.join('、')}</span>
        <span class="chip">匹配方式：科目编码</span>
      </div>

      <div class="match-card ${statusCls}">
        <div class="match-head"><h3>费用与收入匹配性检验</h3><span class="chip ${statusCls}">${status}</span></div>
        <div class="match-grid">
          <div class="match-cell"><div class="lbl">本底稿费用变动率</div><div class="val ${rateCls(expRate)}">${rateText(expRate)}</div></div>
          <div class="match-cell"><div class="lbl">收入变动率</div><div class="val ${rateCls(revRate)}">${rateText(revRate)}</div></div>
          <div class="match-cell"><div class="lbl">差异（百分点）</div><div class="val">${gap === null ? '—' : (gap > 0 ? '+' : '') + gap.toFixed(1)}</div></div>
        </div>
        <p class="match-note">${conclusion}（以 10 个百分点为匹配阈值）</p>
      </div>

      <div class="ratio-section">
        <h3>本底稿科目同比分析</h3>
        <div class="ratio-scroll">
          <table class="ratio-table">
            <thead><tr>
              <th style="width:11%">科目编码</th><th>科目名称</th>
              <th class="num" style="width:16%">本期金额</th><th class="num" style="width:16%">对比期金额</th>
              <th class="num" style="width:16%">变动额</th><th class="num" style="width:12%">变动率</th>
            </tr></thead>
            <tbody>${expBody}</tbody>
          </table>
        </div>
      </div>

      <div class="ratio-section">
        <h3>收入同比分析</h3>
        <div class="ratio-scroll">
          <table class="ratio-table">
            <thead><tr>
              <th style="width:11%">科目编码</th><th>科目名称</th>
              <th class="num" style="width:16%">本期金额</th><th class="num" style="width:16%">对比期金额</th>
              <th class="num" style="width:16%">变动额</th><th class="num" style="width:12%">变动率</th>
            </tr></thead>
            <tbody>${revBody}</tbody>
          </table>
        </div>
      </div>

      <div class="ratio-note">同比分析：按科目编码匹配两个期间的利润表数据，变动率 =（本期 − 对比期）/ |对比期|；对比期金额为 0 时显示「新增」。收入合计为利润表中 4 开头收入类科目（剔除上级汇总行）的合计。金额单位：印尼盾。</div>
    </div>`;
}

      <button class="wp-tab${tab === 'voucher' ? ' active' : ''}" data-wptab="voucher">抽凭表</button>
      <button class="wp-tab${tab === 'ctrl' ? ' active' : ''}" data-wptab="ctrl">控制程序表</button>
      <button class="wp-tab${tab === 'conclusion' ? ' active' : ''}" data-wptab="conclusion">审计结论</button>
    </div>
    ${tab === 'ratio' ? ratioPageHtml() : tab === 'voucher' ? voucherPageHtml() : tab === 'ctrl' ? `
    <div class="ctrl-block">
      ${W().ctrlPrograms.length ? W().ctrlPrograms.map((cp, ci) => {
        const prefix = '控制程序表' + (ci + 1) + '-';
        const cpLk = !!cp.locked;
        const cpDis = cpLk ? ' disabled' : '';
        return '<div class="ctrl-card' + (cpLk ? ' locked' : '') + '" data-ci="' + ci + '">' +
          '<div class="ctrl-card-head">' +
            '<span class="ctrl-no">' + prefix + '</span>' +
            '<input class="ctrl-name" data-f="ctrlName" data-ci="' + ci + '" value="' + esc(cp.name || '') + '" placeholder="填写这张表的名称（如：销售循环 / 采购循环 / 期末关账 …）"' + cpDis + '>' +
            '<button class="ctrl-lock' + (cpLk ? ' on' : '') + '" data-lockctrl="' + ci + '" title="' + (cpLk ? '点击解锁，解锁后可编辑' : '锁定后本表不可编辑') + '">' + (cpLk ? '🔒 已锁定' : '🔓 锁定') + '</button>' +
            '<button class="ctrl-del" data-delctrl="' + ci + '"' + (cpLk ? ' disabled' : '') + '>删除</button>' +
          '</div>' +
          '<table class="ctrl-table ctrl-table-v"><tbody>' +
          (() => {
            const cols = cp.rows || [];
            const cell = (ri, f, tag, ph) => '<td>' +
              (tag === 'select'
                ? '<select data-f="assert" data-ci="' + ci + '" data-ri="' + ri + '"' + cpDis + '>' +
                  ([''].concat(CTRL_TPLS.expense.items)).map(a =>
                    '<option value="' + a + '"' + ((cols[ri].assertion || '') === a ? ' selected' : '') + '>' + (a || '— 请选择 —') + '</option>'
                  ).join('') + '</select>'
                : '<textarea data-f="' + f + '" data-ci="' + ci + '" data-ri="' + ri + '" placeholder="' + ph + '" rows="3"' + cpDis + '>' + esc(cols[ri][f] || '') + '</textarea>') +
              '</td>';
            const rowHtml = (label, f, tag, ph) =>
              '<tr><th class="ctrl-rowh">' + label + '</th>' +
              cols.map((_, ri) => cell(ri, f, tag, ph)).join('') +
              '</tr>';
            return rowHtml('控制类别', 'assertion', 'select', '') +
                   rowHtml('控制程序', 'measure', 'textarea', '控制程序…') +
                   rowHtml('审计程序', 'procedure', 'textarea', '审计程序（如：检查、函证、重新计算…）') +
                   rowHtml('检查结果', 'result', 'textarea', '检查结果…') +
                   '<tr class="ctrl-policy-row"><th class="ctrl-rowh">成文制度</th>' +
                   '<td class="ctrl-policy-cell" colspan="' + Math.max(cols.length, 1) + '">' +
                     '<textarea data-f="policy" data-ci="' + ci + '" placeholder="是否有成文制度（制度名称 / 文号 / 生效日期…）" rows="2"' + cpDis + '>' + esc(cp.policy || '') + '</textarea>' +
                   '</td></tr>' +
                   '<tr><th class="ctrl-rowh-op"></th>' +
                   cols.map((_, ri) => '<td class="num"><button data-delassert="1" data-ci="' + ci + '" data-ri="' + ri + '" title="删除此列"' + cpDis + '>✕</button></td>').join('') +
                   '</tr>';
          })() +
          '</tbody></table>' +
          '<div class="ctrl-row-add"><button class="btn" data-addassert="' + ci + '" style="font-size:12.5px; padding:4px 12px"' + cpDis + '>＋ 新增一列</button></div>' +
        '</div>';
      }).join('') : '<div class="ctrl-empty">暂无控制程序表</div>'}
    </div>
    <div class="ctrl-toolbar">
      <button class="btn" data-addctrl="1">＋ 增加一张控制程序表</button>
      <span style="font-size:12px; color:var(--muted)">共 ${W().ctrlPrograms.length} 张</span>
    </div>` : conclusionHtml()}
    <div style="height:20px"></div>`;
  if((WPTAB[T] || 'voucher') === 'voucher') autoGrowVoucherTextareas(box);
  if(_prevScroll && (WPTAB[T] || 'voucher') === 'voucher'){
    const nw = box.querySelector('.voucher-table-wrap');
    if(nw){ nw.scrollTop = _prevScroll.top; nw.scrollLeft = _prevScroll.left; }
  }

  /* 输入/按钮 → 即时保存；box 是持久容器，每份底稿各绑一次避免监听器叠加 */
  if(!box._issueBound){
    box._issueBound = true;
    box.addEventListener('input', e => {
      if(e.target.matches && e.target.matches('[data-vf]')){
        if(e.target.tagName === 'TEXTAREA'){
          const wrap = box.querySelector('.voucher-table-wrap');
          const st = wrap ? wrap.scrollTop : 0, sl = wrap ? wrap.scrollLeft : 0;
          e.target.style.height = 'auto';
          e.target.style.height = e.target.scrollHeight + 'px';
          if(wrap){ wrap.scrollTop = st; wrap.scrollLeft = sl; }
        }
        const f = e.target.dataset.vf;
        if(f === 'period'){
          W().voucherPeriod = e.target.value;
          saveW();
          return;
        }
        const vi = +e.target.dataset.vi;
        if(W().vouchers[vi]){
          W().vouchers[vi][f] = e.target.value;
          saveW();
          if(f === 'debit' || f === 'credit' || f === 'bizType') updateVoucherChart(box);
        }
        return;
      }
      if(e.target.matches && e.target.matches('[data-f="ctrlName"]')){
        const ci = +e.target.dataset.ci;
        if(W().ctrlPrograms[ci] && !W().ctrlPrograms[ci].locked){
          W().ctrlPrograms[ci].name = e.target.value;
          saveW();
        }
        return;
      }
      if(e.target.matches && e.target.matches('textarea[data-f="policy"]')){
        const ci = +e.target.dataset.ci;
        if(W().ctrlPrograms[ci] && !W().ctrlPrograms[ci].locked){
          W().ctrlPrograms[ci].policy = e.target.value;
          saveW();
        }
        return;
      }
      if(e.target.matches && e.target.matches('input[data-f="assert"], select[data-f="assert"], textarea[data-f="measure"], textarea[data-f="procedure"], textarea[data-f="result"]')){
        const ci = +e.target.dataset.ci, ri = +e.target.dataset.ri;
        if(W().ctrlPrograms[ci] && W().ctrlPrograms[ci].rows[ri]){
          W().ctrlPrograms[ci].rows[ri][e.target.dataset.f] = e.target.value;
          saveW();
        }
        return;
      }
      if(e.target.matches && e.target.matches('[data-concl]')){
        W().conclusion[e.target.dataset.concl] = e.target.value;
        saveW();
        return;
      }
      if(e.target.matches && e.target.matches('[data-conclitem]')){
        const kind = e.target.dataset.conclitem, i = +e.target.dataset.i;
        if(W().conclusion[kind] && W().conclusion[kind][i]){
          W().conclusion[kind][i].text = e.target.value;
          saveW();
        }
        return;
      }
    });
    /* 支持从 Excel 直接粘贴：从当前单元格向右/向下填充，行数不足自动补行 */
    box.addEventListener('paste', e => {
      const cell = e.target.closest && e.target.closest('table.voucher-table [data-vf]');
      if(!cell || W().voucherLocked) return;
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      if(!text) return;
      const startCol = VOUCHER_FIELDS.indexOf(cell.dataset.vf);
      const startRow = +cell.dataset.vi;
      if(startCol < 0 || !isFinite(startRow)) return;
      e.preventDefault();
      const lines = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n');
      lines.forEach((line, r) => {
        const cells = line.split('\t');
        const rowIdx = startRow + r;
        while(W().vouchers.length <= rowIdx) W().vouchers.push(blankVoucher());
        const v = W().vouchers[rowIdx];
        cells.forEach((raw, c) => {
          const f = VOUCHER_FIELDS[startCol + c];
          if(!f) return;
          let val = raw.trim();
          if(f === 'debit' || f === 'credit') val = val.replace(/[,，¥￥\s]/g, '');
          v[f] = val;
        });
      });
      saveW();
      renderIssues(CUR_WP);
      const tgt = box.querySelector('[data-vf="' + VOUCHER_FIELDS[startCol] + '"][data-vi="' + startRow + '"]');
      if(tgt) tgt.focus({preventScroll:true});
    });
    box.addEventListener('change', e => {
      if(e.target.matches && e.target.matches('select[data-ratio]')){
        if(e.target.dataset.ratio === 'cur'){ RATIO_CUR = e.target.value; RATIO_PREV = ''; }
        else RATIO_PREV = e.target.value;
        renderIssues(CUR_WP);
        return;
      }
      if(e.target.matches && e.target.matches('select[data-vf]')){
        const vi = +e.target.dataset.vi;
        if(W().vouchers[vi]){
          W().vouchers[vi][e.target.dataset.vf] = e.target.value;
          saveW();
        }
        return;
      }
      if(e.target.matches && e.target.matches('select[data-f="assert"]')){
        const ci = +e.target.dataset.ci, ri = +e.target.dataset.ri;
        if(W().ctrlPrograms[ci] && W().ctrlPrograms[ci].rows[ri]){
          W().ctrlPrograms[ci].rows[ri].assertion = e.target.value;
          saveW();
        }
      }
    });
    box.addEventListener('click', e => {
      const tabBtn = e.target.closest('[data-wptab]');
      if(tabBtn){
        WPTAB[CUR_WP] = tabBtn.dataset.wptab;
        renderIssues(CUR_WP);
        return;
      }
      if(e.target.closest('[data-lockvoucher]')){
        W().voucherLocked = !W().voucherLocked;
        saveW(); renderIssues(CUR_WP);
        return;
      }
      if(e.target.closest('[data-addvoucher]')){
        if(W().voucherLocked) return;
        W().vouchers.push(blankVoucher());
        saveW(); renderIssues(CUR_WP);
        const nw = box.querySelector('.voucher-table-wrap');
        if(nw) nw.scrollTop = nw.scrollHeight;
        return;
      }
      const delV = e.target.closest('[data-delvoucher]');
      if(delV){
        if(W().voucherLocked) return;
        W().vouchers.splice(+delV.dataset.delvoucher, 1);
        saveW(); renderIssues(CUR_WP);
        return;
      }
      if(e.target.closest('[data-addctrl]')){
        // 打开模板选择弹窗
        const tb = $('#tplBody');
        tb.innerHTML = Object.entries(CTRL_TPLS).map(([k, t]) => `
          <button class="tpl-card" data-tpl="${k}" style="text-align:left; border:1.5px solid #d6e4f5; border-radius:10px; padding:14px 16px; background:#fff; cursor:pointer; font-family:inherit;">
            <div style="font-size:15px; font-weight:700; color:#1a3d6e;">${t.label}</div>
            <div style="font-size:12.5px; color:var(--muted); margin-top:3px;">${t.desc || ''}</div>
            <div style="font-size:12px; color:var(--muted); margin-top:8px;">${t.items.map(i => '<span style="display:inline-block; background:#eef5fb; color:#1a3d6e; padding:2px 8px; border-radius:4px; margin:2px 4px 2px 0; font-size:11.5px;">' + i + '</span>').join('')}</div>
          </button>`).join('');
        $('#tplModal').style.display = 'flex';
        return;
      }
      const lockCtrl = e.target.closest('[data-lockctrl]');
      if(lockCtrl){
        const ci = +lockCtrl.dataset.lockctrl;
        if(!W().ctrlPrograms[ci]) return;
        W().ctrlPrograms[ci].locked = !W().ctrlPrograms[ci].locked;
        saveW(); renderIssues(CUR_WP);
        return;
      }
      const addAssert = e.target.closest('[data-addassert]');
      if(addAssert){
        const ci = +addAssert.dataset.addassert;
        if(W().ctrlPrograms[ci].locked) return;
        W().ctrlPrograms[ci].rows.push({assertion:'', measure:'', procedure:'', result:''});
        saveW(); renderIssues(CUR_WP);
        return;
      }
      const delCtrl = e.target.closest('[data-delctrl]');
      if(delCtrl){
        const ci = +delCtrl.dataset.delctrl;
        if(W().ctrlPrograms[ci].locked){ alert('该控制程序表已锁定，请先解锁后再删除。'); return; }
        if(!confirm('确定删除控制程序表 ' + (ci + 1) + ' ？该操作不可恢复。')) return;
        W().ctrlPrograms.splice(ci, 1);
        saveW(); renderIssues(CUR_WP);
        return;
      }
      const delAssert = e.target.closest('[data-delassert]');
      if(delAssert){
        const ci = +delAssert.dataset.ci, ri = +delAssert.dataset.ri;
        if(W().ctrlPrograms[ci].locked) return;
        W().ctrlPrograms[ci].rows.splice(ri, 1);
        saveW(); renderIssues(CUR_WP);
        return;
      }
      const addConcl = e.target.closest('[data-addconcl]');
      if(addConcl){
        const kind = addConcl.dataset.addconcl;
        if(!Array.isArray(W().conclusion[kind])) W().conclusion[kind] = [];
        W().conclusion[kind].push({text:''});
        saveW(); renderIssues(CUR_WP);
        const items = box.querySelectorAll(`[data-conclitem="${kind}"]`);
        if(items.length) items[items.length - 1].focus();
        return;
      }
      const delConcl = e.target.closest('[data-delconcl]');
      if(delConcl){
        const kind = delConcl.dataset.delconcl, i = +delConcl.dataset.i;
        if(W().conclusion[kind]) W().conclusion[kind].splice(i, 1);
        saveW(); renderIssues(CUR_WP);
        return;
      }
      if(e.target.closest('[data-exportword]')){
        exportConclusionWord();
        return;
      }
    });
  }
}

/* =====================================================
   十、页面切换（侧边栏层级导航）
===================================================== */
let currentPage = 'stmt:bs';
const LS_GRP = 'fsv.navGroups.v1';   // 一级分组折叠状态 {key: true=折叠}
let NAV_GRP = load(LS_GRP, {});
const saveGrp = () => localStorage.setItem(LS_GRP, JSON.stringify(NAV_GRP));

function applyGroupState(){
  document.querySelectorAll('.side-item.group[data-group]').forEach(g => {
    const key = g.dataset.group;
    const collapsed = !!NAV_GRP[key];
    g.classList.toggle('collapsed', collapsed);
    const box = document.getElementById('grp-' + key);
    if(box) box.classList.toggle('hidden', collapsed);
  });
}

function switchPage(page){
  currentPage = page;
  const isStmt = page.startsWith('stmt:');
  if(isStmt) stmtTab = page.slice(5);
  $('#stmt').style.display = isStmt ? '' : 'none';
  for(const t of Object.keys(EXP_WPS))
    $('#' + EXP_WPS[t].box).classList.toggle('active', page === EXP_WPS[t].box);
  /* 报表页才显示搜索/工具栏及期间/导入报表栏 */
  document.querySelector('.toolbar').style.display = isStmt ? '' : 'none';
  document.querySelector('.manager').style.display = isStmt ? '' : 'none';
  /* 高亮：子页高亮 + 父级 group 标记 */
  document.querySelectorAll('.side-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.querySelectorAll('.side-item.group').forEach(g => {
    g.classList.toggle('active', page === g.dataset.group || page.startsWith(g.dataset.group + ':'));
  });
  if(isStmt) render();
  for(const t of Object.keys(EXP_WPS))
    if(page === EXP_WPS[t].box) renderIssues(t);
}

/* 侧边栏点击：分组折叠 / 页面切换 */
document.querySelector('.sidebar').addEventListener('click', e => {
  const btn = e.target.closest('.side-item');
  if(!btn) return;
  /* 一级分组折叠（点箭头区域折叠） */
  if(btn.classList.contains('group')){
    const key = btn.dataset.group;
    if(e.target.closest('.arrow') || !btn.dataset.page){
      NAV_GRP[key] = !NAV_GRP[key]; saveGrp(); applyGroupState();
      document.querySelectorAll('.side-item').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
      return;
    }
  }
  if(btn.classList.contains('disabled')) return;
  if(!btn.dataset.page) return;
  switchPage(btn.dataset.page);
});
