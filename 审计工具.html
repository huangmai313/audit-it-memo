/* =====================================================
   十三、工作日报模块（合并自 日报/日报工具.html）
   草稿存 localStorage: daily_report_draft，与原工具数据互通
===================================================== */
const DR_KEY = 'daily_report_draft';
const DR_SECTIONS = ['today', 'tomorrow', 'issues', 'notes'];
const DR_TITLES = {today:'今日工作', tomorrow:'明日计划', issues:'问题与待改进', notes:'备注'};
let DR_INITED = false;

const drRoot = () => document.getElementById('appReport');
const drSec  = name => drRoot().querySelector('.section[data-section="' + name + '"]');
function drToday(){
  const t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}

function drSaveDraft(){
  const data = {date: document.getElementById('drDate').value};
  DR_SECTIONS.forEach(s => {
    data[s] = [];
    drSec(s).querySelectorAll('.items > .item').forEach(it => {
      data[s].push({
        text: it.querySelector('textarea').value,
        images: [...it.querySelectorAll('.img-preview')].map(im => im.src)
      });
    });
  });
  localStorage.setItem(DR_KEY, JSON.stringify(data));
}

function drAddImage(imgList, dataURL){
  const wrap = document.createElement('div');
  wrap.className = 'img-wrap';
  const im = document.createElement('img');
  im.className = 'img-preview';
  im.src = dataURL;
  const rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'remove-img';
  rm.textContent = '删除图片';
  rm.addEventListener('click', () => { wrap.remove(); drSaveDraft(); });
  wrap.appendChild(im); wrap.appendChild(rm);
  imgList.appendChild(wrap);
  drSaveDraft();
}

function drCreateItem(text = '', imageData = null){
  const item = document.createElement('div');
  item.className = 'item';

  const num = document.createElement('div');
  num.className = 'num';

  const content = document.createElement('div');
  content.className = 'content';

  const imgList = document.createElement('div');
  imgList.className = 'img-list';

  const ta = document.createElement('textarea');
  ta.placeholder = '请输入内容…（可直接 Ctrl+V 粘贴截图）';
  ta.value = text;
  ta.addEventListener('input', drSaveDraft);

  /* 粘贴剪贴板图片（支持一次粘贴多张） */
  ta.addEventListener('paste', e => {
    const cbd = e.clipboardData;
    if(!cbd) return;
    const files = [];
    if(cbd.items){
      for(let i = 0; i < cbd.items.length; i++){
        if(cbd.items[i].type.indexOf('image') !== -1){
          const f = cbd.items[i].getAsFile();
          if(f) files.push(f);
        }
      }
    }
    if(!files.length && cbd.files){
      for(let i = 0; i < cbd.files.length; i++){
        if(cbd.files[i].type.indexOf('image') !== -1) files.push(cbd.files[i]);
      }
    }
    if(files.length){
      e.preventDefault();
      files.forEach(f => {
        const reader = new FileReader();
        reader.onload = ev => drAddImage(imgList, ev.target.result);
        reader.readAsDataURL(f);
      });
    }
  });

  content.appendChild(ta);
  content.appendChild(imgList);

  /* 图片上传 / 粘贴按钮 */
  const imgActions = document.createElement('div');
  imgActions.className = 'img-actions';

  const fileLabel = document.createElement('label');
  fileLabel.textContent = '📷 添加图片';
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.multiple = true;
  fileLabel.appendChild(fileInput);

  const pasteBtn = document.createElement('button');
  pasteBtn.type = 'button';
  pasteBtn.className = 'paste-btn';
  pasteBtn.textContent = '📋 粘贴截图';
  pasteBtn.addEventListener('click', async () => {
    try{
      if(navigator.clipboard && navigator.clipboard.read){
        const items = await navigator.clipboard.read();
        let found = 0;
        for(const it of items){
          for(const type of it.types){
            if(type.indexOf('image') !== -1){
              const blob = await it.getType(type);
              const reader = new FileReader();
              reader.onload = ev => drAddImage(imgList, ev.target.result);
              reader.readAsDataURL(blob);
              found++;
            }
          }
        }
        if(!found){
          pasteBtn.textContent = '剪贴板中没有图片';
          setTimeout(() => { pasteBtn.textContent = '📋 粘贴截图'; }, 2000);
        }
      }else{
        pasteBtn.textContent = '浏览器不支持，请用 Ctrl+V';
        setTimeout(() => { pasteBtn.textContent = '📋 粘贴截图'; }, 2500);
      }
    }catch(err){
      console.error(err);
      pasteBtn.textContent = '需授权剪贴板访问';
      setTimeout(() => { pasteBtn.textContent = '📋 粘贴截图'; }, 2500);
    }
  });

  imgActions.appendChild(fileLabel);
  imgActions.appendChild(pasteBtn);
  content.appendChild(imgActions);

  /* 恢复草稿中的图片（兼容旧格式：单张字符串） */
  if(imageData){
    (Array.isArray(imageData) ? imageData : [imageData]).forEach(d => { if(d) drAddImage(imgList, d); });
  }

  fileInput.addEventListener('change', e => {
    [...e.target.files].forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => drAddImage(imgList, ev.target.result);
      reader.readAsDataURL(file);
    });
    fileInput.value = '';
  });

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.textContent = '×';
  delBtn.title = '删除该条目';
  delBtn.addEventListener('click', () => {
    const sec = item.closest('.section');
    item.remove();
    drRenumber(sec);
    drSaveDraft();
  });

  item.appendChild(num);
  item.appendChild(content);
  item.appendChild(delBtn);
  return item;
}

function drRenumber(sec){
  sec.querySelectorAll('.items > .item').forEach((it, idx) => {
    it.querySelector('.num').textContent = (idx + 1) + '、';
  });
}

function drLoadDraft(){
  const dateEl = document.getElementById('drDate');
  let data = null;
  try{
    const raw = localStorage.getItem(DR_KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){ data = null; }
  DR_SECTIONS.forEach(s => {
    const sec = drSec(s);
    const box = sec.querySelector('.items');
    box.innerHTML = '';
    const arr = (data && data[s] && data[s].length) ? data[s] : [{text:'', images:[]}];
    arr.forEach(it => {
      const imgs = it.images || (it.image ? [it.image] : null);
      box.appendChild(drCreateItem(it.text || '', imgs));
    });
    drRenumber(sec);
  });
  /* 日期默认取当天；草稿里存的是历史日期则自动更新为当天 */
  const savedDate = (data && data.date) || '';
  dateEl.value = (savedDate === drToday()) ? savedDate : drToday();
  drSaveDraft();
}

/* dataURL → Uint8Array */
function drDataURLToBytes(dataURL){
  const arr = dataURL.split(',');
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8 = new Uint8Array(n);
  while(n--) u8[n] = bstr.charCodeAt(n);
  return u8;
}

/* 图片尺寸（按宽度上限等比缩放） */
function drImageSize(dataURL, maxWidthInches = 5.5){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const ratio = img.height / img.width;
      let w = maxWidthInches * 96, h = w * ratio;
      if(h > 7 * 96){ h = 7 * 96; w = h / ratio; }
      resolve({width:w, height:h});
    };
    img.onerror = () => resolve({width:maxWidthInches*96, height:maxWidthInches*96});
    img.src = dataURL;
  });
}

function drFormatDate(s){
  if(!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `日期：${y} 年 ${m} 月 ${d} 日`;
}

async function drExportWord(){
  const btn = document.getElementById('drExport');
  const status = document.getElementById('drStatus');
  if(typeof docx === 'undefined' || typeof saveAs === 'undefined'){
    status.textContent = '导出库加载失败（需要联网加载 docx / FileSaver），请检查网络后刷新重试。';
    status.style.color = 'var(--neg)';
    return;
  }
  btn.disabled = true;
  status.textContent = '正在生成 Word 文件…';
  status.style.color = 'var(--muted)';

  try{
    const {Document, Paragraph, TextRun, ImageRun, Packer, AlignmentType} = docx;
    const dateStr = document.getElementById('drDate').value;
    const children = [];

    children.push(new Paragraph({children:[new TextRun({text:'工作日报', bold:true, size:30})]}));
    children.push(new Paragraph({children:[new TextRun({text:drFormatDate(dateStr), bold:true, size:30})]}));
    children.push(new Paragraph({children:[]}));

    for(const s of DR_SECTIONS){
      children.push(new Paragraph({children:[new TextRun({text:DR_TITLES[s], bold:true, size:30})]}));
      const items = drSec(s).querySelectorAll('.items > .item');
      let idx = 0;
      for(const it of items){
        const text = it.querySelector('textarea').value.trim();
        const imgEls = it.querySelectorAll('.img-preview');
        idx++;
        const prefix = idx + '、';
        if(imgEls.length){
          const caption = prefix + text + (text ? '：' : '');
          children.push(new Paragraph({alignment:AlignmentType.LEFT, children:[new TextRun({text:caption, size:24})]}));
          for(const imgEl of imgEls){
            const bytes = drDataURLToBytes(imgEl.src);
            const size = await drImageSize(imgEl.src);
            children.push(new Paragraph({children:[new ImageRun({data:bytes, transformation:{width:size.width, height:size.height}})]}));
          }
        }else{
          children.push(new Paragraph({alignment:AlignmentType.LEFT, children:[new TextRun({text:prefix + text, size:24})]}));
        }
      }
    }

    const doc = new Document({sections:[{properties:{}, children}]});
    const blob = await Packer.toBlob(doc);
    const [y, m, d] = (dateStr || drToday()).split('-');
    const filename = `工作日报-${m}${d}.docx`;
    saveAs(blob, filename);

    status.textContent = '✓ 导出成功：' + filename;
    status.style.color = 'var(--green)';
  }catch(err){
    console.error(err);
    status.textContent = '导出失败：' + err.message;
    status.style.color = 'var(--neg)';
  }finally{
    btn.disabled = false;
    setTimeout(() => { status.textContent = ''; }, 4000);
  }
}

function initReportApp(){
  if(DR_INITED) return;
  DR_INITED = true;
  drRoot().querySelectorAll('.section').forEach(sec => {
    sec.querySelector('.add-btn').addEventListener('click', () => {
      const item = drCreateItem();
      sec.querySelector('.items').appendChild(item);
      drRenumber(sec);
      item.querySelector('textarea').focus();
      drSaveDraft();
    });
  });
  document.getElementById('drDate').addEventListener('change', drSaveDraft);
  document.getElementById('drExport').addEventListener('click', drExportWord);
  document.getElementById('drClear').addEventListener('click', () => {
    if(!confirm('确定要清空所有内容吗？')) return;
    localStorage.removeItem(DR_KEY);
    DR_SECTIONS.forEach(s => {
      const sec = drSec(s);
      const box = sec.querySelector('.items');
      box.innerHTML = '';
      box.appendChild(drCreateItem());
      drRenumber(sec);
    });
    drSaveDraft();
  });
  drLoadDraft();
}

applyGroupState();
render();
</script>
